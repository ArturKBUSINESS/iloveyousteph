<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>For Stephanie — Artur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Subset fonts to only glyphs on this page — smaller download on cellular -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&display=swap&text=A%20little%20note%20for%20youI%20love%20you%20so%20much%2C%20StephanieYou%20mean%20the%20world%20to%20me.%20Thank%20you%20so%20much%20for%20being%20you.From%20ArturRecognise%20him%3F" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="hearts" aria-hidden="true"></div>

  <main class="stack">
    <div class="card">
      <p class="eyebrow">A little note for you</p>
      <h1 class="headline">I love you so much, Stephanie</h1>
      <p class="message">
        You mean the world to me. Thank you so much for being you.
      </p>
      <p class="signature">From <span>Artur</span></p>
    </div>

    <section class="media" aria-label="Videos and photo">
      <div class="video-list">
        <video
          class="clip"
          controls
          playsinline
          webkit-playsinline
          preload="metadata"
          x-webkit-airplay="allow"
        >
          <source src="139D9C49-A46D-4057-82AE-7A4E35869CEE.MOV" type="video/quicktime" />
        </video>
        <video
          class="clip"
          controls
          playsinline
          webkit-playsinline
          preload="metadata"
          x-webkit-airplay="allow"
        >
          <source src="ScreenRecording_05-03-2026%2010-31-53%E2%80%AFPM_1.MOV" type="video/quicktime" />
        </video>
      </div>

      <figure class="guess">
        <img
          class="guess__img"
          src="a-bronx-tale-Lillo-Brancato-tibet-house-2018-100125-c4c318e9b3a74edbbc6a9318269eed4e.jpg"
          alt="Photo for you to guess"
          loading="lazy"
          decoding="async"
        />
        <figcaption class="guess__caption">Recognise him?</figcaption>
      </figure>
    </section>
  </main>

  <script src="hearts.js" defer></script>
</body>
</html>
